<body>
<title>DaJak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: slunná izometrická kancelář přes celou plochu, ovládání v postranních panelech (desktop) a vysouvacích listech (telefon). */
:root{
  --sky:#BFE6F5; --lawn:#B8DBEE; --paper:#17293F; --mist:#22374F; --line:#34506C;
  --ink:#F2F6FA; --ink2:#B2C4D3; --teal:#2FC49A; --teal-d:#5BE3BB; --sun:#FFC83D; --sun-d:#D99A0B; --coral:#F2644B; --dark:#12233A;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--lawn);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;font-size:14px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,select,summary{touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);position:relative}
#hud{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--paper);box-shadow:0 2px 10px rgba(29,58,74,.14);z-index:5}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo b{width:40px;height:40px;border-radius:11px;background:var(--sun);display:grid;place-items:center;font:800 26px/1 var(--display);color:var(--dark)}
.logo h1{font:800 20px/1.05 var(--display);margin:0}
.logo small{display:block;font:700 12px/1.2 var(--body);color:var(--ink2)}
.stats{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:#22374F;border:1px solid #33506E;border-radius:10px;padding:5px 11px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--ink2);white-space:nowrap}
.stat strong{display:block;font:800 19px/1.15 var(--display);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.stat.money strong{color:var(--teal-d)}
.stars{color:var(--sun);letter-spacing:1px}
.stars .se{font-style:normal;color:#7E8FA3;opacity:.55}
#nav button{position:relative}#nav button.badge::after{content:'';position:absolute;top:7px;right:calc(50% - 18px);width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--paper)}
details.law>summary{list-style:none;cursor:pointer}details.law>summary::-webkit-details-marker{display:none}details.law:not([open])>summary .lh{margin:0}
.setbox{display:grid;gap:8px}
.offer{display:grid;gap:6px}.offer b{font-size:14px}.offer select,.case select{width:100%;min-height:42px;border-radius:10px;background:#0F1E30;color:var(--ink);border:1px solid var(--line);padding:0 8px;font:700 13px var(--body)}.offer em{font-style:normal;color:var(--teal-d);font-weight:800}
.diff{font-weight:800}.diff.d0{color:#7FE0B0}.diff.d1{color:var(--sun)}.diff.d2{color:#FF9C8A}
.autoc{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink2);padding:6px 2px}.autoc input{width:22px;height:22px;accent-color:var(--teal)}
.rowsp{display:flex;justify-content:space-between;align-items:center;gap:8px}.rowsp small.up{color:var(--teal-d)}.rowsp small.down{color:#FF9C8A}.bar.mor i{background:linear-gradient(90deg,#F2644B,#FFC83D 50%,#2FC49A)}.neg{font-style:normal;color:#FF9C8A;font-weight:800}
.fl.lost{color:#FFB4A6}
.pkgs{display:grid;gap:8px}.pkg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--mist);border:2px solid #33506E;border-radius:12px;padding:10px 12px}.pkg b{display:block;font-size:15px}.pkg small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.3}.pkg em{font-style:normal;font:800 17px var(--display);color:var(--sun);text-align:right}.pkg em small{font:600 11px var(--body)}.pkg.prem{border-color:var(--sun);background:#2E3524}.pkg[disabled]{opacity:.55}.setbox .buy,.setbox .ghost{width:100%}
#main{position:relative;min-height:0;display:grid;grid-template-columns:292px minmax(0,1fr) 384px}
#stage{position:relative;min-width:0;min-height:0;background:var(--lawn);overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.panel{background:var(--paper);display:flex;flex-direction:column;min-height:0;z-index:3}
#left{box-shadow:2px 0 10px rgba(29,58,74,.1);padding:12px;gap:10px;overflow-y:auto}
#right{box-shadow:-2px 0 10px rgba(29,58,74,.1)}
.panel-head{display:none}
.card{background:var(--mist);border-radius:12px;padding:10px 12px}
.case{display:grid;gap:5px;width:100%;text-align:left}
.case b{font-size:14px;line-height:1.25}
.bar{height:9px;border-radius:5px;background:#0F1E30;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:5px;transition:width .2s linear}
.case small,.muted{font-size:12.5px;color:var(--ink2);line-height:1.3}
.case .row{display:flex;justify-content:space-between;gap:8px}
.case .row em{font-style:normal;color:var(--teal-d);white-space:nowrap}
#event{background:var(--coral);color:#fff;border-radius:12px;padding:11px 12px;display:grid;gap:6px}
#event small{font-size:12px;letter-spacing:.05em}
#event h3{font-size:19px}
#event p{margin:0;font-size:13.5px;line-height:1.3}
#event button{background:#fff;color:#A83421;border-radius:10px;min-height:44px;font-weight:800}
#boost{background:var(--sun);color:var(--dark);border-radius:12px;padding:9px 12px;font-weight:800}
#goal{background:#163F47;border-radius:12px;padding:10px 12px;display:grid;gap:4px}
#goal small{font-size:12px;color:var(--teal-d);letter-spacing:.05em}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:10px 12px 8px}
.tabs button{min-height:44px;border-radius:10px;color:var(--ink2);background:var(--mist);font-weight:800}
.tabs button[aria-selected=true]{background:#2F7DE0;color:#fff}
#rc{flex:1;overflow-y:auto;min-height:0;padding:2px 12px 14px;display:flex;flex-direction:column;gap:8px}
.rm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--mist);border-radius:12px;padding:9px 11px;text-align:left;width:100%}
.rm b{display:block;font-size:15px;line-height:1.2}
.rm small{font-size:12.5px;color:var(--ink2);display:block;line-height:1.3}
.rm .go{font:800 18px var(--display);color:var(--ink2)}
.buy{background:var(--sun);color:var(--dark);border-radius:10px;min-height:44px;padding:5px 12px;font-weight:800;box-shadow:0 3px 0 var(--sun-d);line-height:1.15}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-d)}
.buy[disabled]{background:#2A4058;color:#A9BCCB;box-shadow:none;cursor:not-allowed}
.buy.full{width:100%}
.back{min-height:44px;color:var(--teal-d);font-weight:800;text-align:left;padding:0 2px;align-self:flex-start}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rhead h2{font-size:23px}
.cats{display:flex;gap:5px;overflow-x:auto;padding:2px 0 5px;flex-shrink:0;scrollbar-width:thin}
.cats button{min-height:40px;white-space:nowrap;padding:0 11px;border-radius:20px;background:var(--mist);color:var(--ink2);font-weight:800;font-size:13px}
.cats button[aria-pressed=true]{background:var(--teal);color:#fff}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.opt{background:var(--mist);border-radius:11px;padding:5px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;border:2.5px solid transparent;min-width:0;text-align:center}
.opt canvas{width:84px;height:66px;display:block;max-width:100%}
.opt b{font-size:12px;line-height:1.15}
.opt small{font-size:11.5px;color:var(--ink2);line-height:1.2}
.opt.on{border-color:var(--teal);background:#163F47}
.opt.pv{border-color:var(--coral);background:#43292F}
.opt.lk{opacity:.72}
#buybar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:#43292F;border-radius:12px;padding:8px 10px;margin:0 12px 10px}
#buybar small{display:block;font-size:12.5px;color:var(--ink2)}
.ghost{min-height:44px;padding:0 12px;border-radius:10px;background:var(--mist);font-weight:800}
textarea{width:100%;height:76px;font:600 11px/1.3 ui-monospace,monospace;border:1px solid var(--line);border-radius:9px;padding:7px;color:var(--ink);background:#0F1E30}
#work{display:none;position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sun);color:var(--dark);border-radius:16px;padding:9px 26px 8px;font:800 22px/1.05 var(--display);box-shadow:0 6px 0 var(--sun-d),0 12px 20px rgba(29,58,74,.25);white-space:nowrap;z-index:2;min-height:58px}
#work small{display:block;font:800 13px/1.2 var(--body);color:#5A4300}
#work:active{transform:translate(-50%,4px);box-shadow:0 2px 0 var(--sun-d)}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:grid;gap:6px;z-index:2}
.zoom button{width:44px;height:44px;border-radius:12px;background:var(--paper);color:#fff;border:2px solid #3A5674;font:800 22px/1 var(--display);box-shadow:0 3px 10px rgba(10,25,45,.45)}
.fl{position:absolute;pointer-events:none;font:800 18px var(--display);color:#fff;text-shadow:0 2px 0 rgba(29,58,74,.55);animation:fl .9s ease-out forwards;z-index:4;white-space:nowrap}
@keyframes fl{to{transform:translateY(-68px);opacity:0}}
#toast{position:absolute;left:112px;right:10px;margin:0 auto;width:fit-content;top:14px;transform:none;background:var(--paper);color:#fff;padding:9px 15px;border-radius:12px;z-index:6;font-size:14px;max-width:none;text-align:center;line-height:1.25}
#nav{display:none}
#pills{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.rpill{position:absolute;left:0;top:0;pointer-events:auto;background:rgba(18,35,58,.93);color:#fff;border:2px solid #2F7DE0;border-radius:11px;padding:4px 10px 5px;text-align:center;line-height:1.1;white-space:nowrap;box-shadow:0 0 12px rgba(47,125,224,.6)}
.rpill b{display:block;font-size:12.5px}.rpill small{display:block;font-size:11.5px;color:#B8D4F2;font-weight:800}
.rpill.can{border-color:var(--sun);box-shadow:0 0 14px rgba(255,200,61,.75)}.rpill.can small{color:var(--sun)}
.rpill.lock:not(.can){border-color:#5D7186;box-shadow:none}
.rpill.mini small{display:none}.rpill.mini{padding:2px 7px}.rpill.mini b{font-size:11px}
#floorWrap{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;z-index:2;display:grid;gap:6px;justify-items:start}
#floorName{background:rgba(18,35,58,.93);color:#fff;border-radius:9px;padding:5px 10px;font-size:12.5px;white-space:nowrap}
#floors{display:grid;gap:4px}
#floors button{width:44px;height:44px;border-radius:11px;background:rgba(23,41,63,.95);border:2px solid #3A5674;color:#fff;font:800 16px var(--display)}
#floors button[aria-pressed=true]{background:#2F7DE0;border-color:#8FC0FF}
.nogl{padding:24px;color:#12233A;max-width:40ch}
@media all{
  #main{grid-template-columns:minmax(0,1fr)}
  #hud{flex-wrap:wrap;gap:6px;padding-block:6px}
  .logo{display:none}
  .stats{gap:5px}
  .stat{padding:4px 7px}
  .stat span{font-size:11px}
  .stat strong{font-size:15px}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:62%;border-radius:18px 18px 0 0;box-shadow:0 -6px 22px rgba(29,58,74,.25);padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  #left{padding-inline:max(12px,env(safe-area-inset-left,0px))}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:2px}
  #right .panel-head{padding:8px 12px 0}
  .panel-head h2{font-size:20px}
  .panel:not(.open){display:none}
  #floors button{width:42px;height:44px}
  body.sheet #floorWrap{display:none}
  .rpill small{display:none}.rpill{padding:3px 8px}.rpill b{font-size:11.5px}
  #nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;position:absolute;left:0;right:0;bottom:0;background:var(--paper);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:4;box-shadow:0 -2px 10px rgba(29,58,74,.14)}
  #nav button{min-height:46px;border-radius:11px;background:var(--mist);font-weight:800;display:grid;place-items:center;color:var(--ink2)}
  #nav button[aria-pressed=true]{background:#2F7DE0;color:#fff}
  #work{bottom:calc(68px + env(safe-area-inset-bottom,0px));font-size:20px;padding-inline:22px}
  body.sheet #work{display:none}
  body.sheetfull .panel{top:0;max-height:none;border-radius:0;box-shadow:none}
  .tabs{display:none}
  .rhead h2{display:none}
  .stat .stars{font-size:12px;letter-spacing:0;line-height:19px}
  .opt canvas{height:54px;width:69px}
}
@media (prefers-reduced-motion:reduce){.fl{animation-duration:.01s}.bar i{transition:none}}
.rpill{background:rgba(18,35,58,.72)!important;border:0!important;box-shadow:none!important;border-radius:7px!important;padding:3px 8px!important;font-size:12px;font-weight:700;color:#E8F0F8!important;pointer-events:none!important;white-space:nowrap}

.rm.hallcard{background:#1F4A4F}
.logoin{display:grid;gap:6px;background:var(--mist);border-radius:12px;padding:8px 10px}.logoin label{display:grid;gap:3px;font-size:12.5px;color:var(--ink2)}.logoin input{font:inherit;font-size:15px;padding:7px 9px;border-radius:9px;border:1px solid #3A5068;background:#0F1E30;color:#fff}
.law{background:var(--mist);border-radius:12px;padding:10px 11px;display:grid;gap:7px}
.law.idle{outline:2px dashed #5D7186;outline-offset:-2px}
.lh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center}
.lh b{display:block;font-size:14.5px;line-height:1.2}.lh small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.3}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 14px var(--display);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.sk div{display:grid;grid-template-columns:78px minmax(0,1fr) 16px;gap:6px;align-items:center;font-size:12px;color:var(--ink2)}
.sk i{height:7px;border-radius:4px;background:#0F1E30;overflow:hidden;display:block}.sk i b{display:block;height:100%;background:var(--teal);border-radius:4px}
.sk em{font-style:normal;font-weight:800;color:var(--ink);text-align:right}
.perk{font-size:12.5px;line-height:1.3;color:#FFE08A;background:#3A3420;border-radius:8px;padding:5px 8px}
.la{display:flex;gap:6px;flex-wrap:wrap}.la .buy{flex:1;min-width:0}
.la select{flex:1;min-width:0;min-height:44px;border-radius:10px;background:#0F1E30;color:var(--ink);border:1px solid var(--line);padding:0 8px;font:700 13px var(--body)}
.xp{height:4px;border-radius:2px;background:#0F1E30;overflow:hidden}.xp i{display:block;height:100%;background:var(--sun)}
.warn{font-size:12.5px;color:#FF9C8A}
.tsum{display:grid;gap:6px}.tg{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.tg span{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between}.tg em{font-style:normal;font-weight:800;color:var(--teal-d)}
.lawbox{display:grid;gap:7px}
.case .lead{color:var(--teal-d)}
@media (max-width:420px){.sk{grid-template-columns:1fr}}
.gl{display:flex;justify-content:space-between;gap:10px;line-height:1.3;padding-top:4px}.gl b{color:#7FE3B5;white-space:nowrap;font-size:13px}
@media all{#left{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}#right .panel-head,#left .panel-head{padding:2px 12px 10px;align-items:center}#left .panel-head{padding:0 0 6px}.panel-head .ghost{min-height:34px;padding:5px 14px;margin-top:-4px}
#nav button{min-height:50px;gap:1px;padding:4px 0 3px;grid-template-rows:auto auto}#nav button svg{width:22px;height:22px}#nav button i{font-style:normal;font-size:10px;letter-spacing:-.2px;font-weight:800;line-height:1}.panel{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}}
#app{position:fixed;inset:0;height:auto}
@media all{#nav{padding-bottom:max(6px,calc(env(safe-area-inset-bottom,0px) - 16px))}.panel{padding-bottom:calc(58px + max(6px,calc(env(safe-area-inset-bottom,0px) - 16px)))}#left{padding-bottom:calc(76px + max(6px,calc(env(safe-area-inset-bottom,0px) - 16px)))}}
</style>

<div id="app">
  <header id="hud">
    <div class="logo"><b aria-hidden="true">§</b><div><h1>DaJak</h1><small id="branch">Manhattan, New York</small></div></div>
    <div class="stats">
      <div class="stat money"><span>Honoráře</span><strong id="sMoney">$250</strong></div>
      <div class="stat"><span>Příjem</span><strong id="sRate">$0/s</strong></div>
      <div class="stat"><span>Vzhled</span><strong id="sStyle" class="stars"></strong></div>
      <div class="stat"><span id="sTierL">Klientela</span><strong id="sTier"></strong></div>
    </div>
  </header>
  <div id="main">
    <aside id="left" class="panel" aria-label="Spisy a události">
      <div class="panel-head"><h2>Spisy</h2><button class="ghost" data-act="close">Zavřít</button></div>
      <div id="goal" hidden></div>
      <div id="boost" hidden></div>
      <div id="event" hidden></div>
      <h2 style="font-size:19px">Rozpracované spisy</h2>
      <div id="cases" style="display:grid;gap:8px"></div>
      <div class="card" id="tierCard"></div>
    </aside>
    <div id="stage">
      <canvas id="c" role="img" aria-label="Pohled shora na patro mrakodrapu s advokátní kanceláří a Manhattanem v pozadí. Klepnutím na místnost ji otevřete."></canvas>
      <div id="pills"></div><div id="floorWrap"><div id="floors"></div></div>
      
      
      <div id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <aside id="right" class="panel" aria-label="Správa kanceláře">
      <div class="panel-head"><h2 id="rt">Místnosti</h2><button class="ghost" data-act="close">Zavřít</button></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-act="tab" data-v="rooms">Místnosti</button>
        <button role="tab" data-act="tab" data-v="team">Tým</button>
        <button role="tab" data-act="tab" data-v="ups">Vylepšení</button>
        <button role="tab" data-act="tab" data-v="set">Uložení</button>
      </div>
      <div id="rc"></div>
      <div id="rcfoot"></div>

function fmt(n){
  if(!isFinite(n))return '∞';
  n=Math.floor(n);
  const a=Math.abs(n);
  const sp=x=>String(x).replace(/\B(?=(\d{3})+(?!\d))/g,nb);
  if(a<100000)return sp(n);
  if(a>=1e27)return n.toExponential(2).replace('.',',').replace('e+','×10^');
  const u=[[1e24,'kvadr.'],[1e21,'trld.'],[1e18,'tril.'],[1e15,'bld.'],[1e12,'bil.'],[1e9,'mld.'],[1e6,'mil.'],[1e3,'tis.']];
  for(const [v,s] of u){if(a>=v){const q=n/v;let d=Math.abs(q)>=100?0:Math.abs(q)>=10?1:2,t=d?q.toFixed(d):String(Math.floor(q));if(d===2&&Math.abs(+t)>=10){d=1;t=q.toFixed(1)}if(d===1&&Math.abs(+t)>=100)t=String(Math.floor(q));return t.replace('.',',')+nb+s}}
  return sp(n);
}
